name: Deploy Medify API to cPanel
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deployment/scripts/ftp-upload.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medify-api-production
  cancel-in-progress: false
jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Prepare API files (preserve server data)
        run: |
          mkdir -p "$RUNNER_TEMP/medify-api"
          cp -a backend/. "$RUNNER_TEMP/medify-api/"
          rm -rf "$RUNNER_TEMP/medify-api/node_modules" "$RUNNER_TEMP/medify-api/.env" "$RUNNER_TEMP/medify-api/.local-data" "$RUNNER_TEMP/medify-api/private-uploads" "$RUNNER_TEMP/medify-api/tmp" "$RUNNER_TEMP/medify-api/uploads" "$RUNNER_TEMP/medify-api/medify-storage"
      - name: Deploy backend via explicit FTPS
        env: &ftp_env
          FTP_HOST: ${{ secrets.API_FTP_SERVER }}
          FTP_USER: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.API_FTP_PORT }}
          FTP_DIR: ${{ secrets.API_FTP_DIR }}
        run: bash deployment/scripts/ftp-upload.sh "$RUNNER_TEMP/medify-api"
      - name: Restart cPanel Passenger Node app
        env: *ftp_env
        run: |
          mkdir -p "$RUNNER_TEMP/passenger-restart"
          date -u +%FT%TZ > "$RUNNER_TEMP/passenger-restart/restart.txt"
          FTP_DIR="${FTP_DIR%/}/tmp" bash deployment/scripts/ftp-upload.sh "$RUNNER_TEMP/passenger-restart"
      - name: Verify API health
        run: curl --fail --show-error --silent --retry 5 --retry-delay 8 --retry-connrefused --max-time 20 https://site.med-ify.live/api/healthz
