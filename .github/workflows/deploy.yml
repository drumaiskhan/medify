
name: Deploy Medify API to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deployment/scripts/ftp-upload.sh'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medify-api-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy Medify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_HOST: "162.55.6.159"
      FTP_PORT: "21"
      FTP_USER: "medifydeploy@site.med-ify.live"
      FTP_DIR: "/"
      FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install FTPS client
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # 3. Validate deployment configuration
      - name: Validate FTP configuration
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_DIR"

          echo "FTP configuration provided."
          echo "Target: Medify API"

      # 4. Prepare backend files
      - name: Prepare Medify backend
        run: |
          mkdir -p "$RUNNER_TEMP/medify-api"

          cp -a backend/. "$RUNNER_TEMP/medify-api/"

          rm -rf \
            "$RUNNER_TEMP/medify-api/node_modules" \
            "$RUNNER_TEMP/medify-api/.env" \
            "$RUNNER_TEMP/medify-api/.local-data" \
            "$RUNNER_TEMP/medify-api/private-uploads" \
            "$RUNNER_TEMP/medify-api/uploads" \
            "$RUNNER_TEMP/medify-api/medify-storage" \
            "$RUNNER_TEMP/medify-api/tmp"

          echo "Medify backend prepared."

      # 5. Check FTP connectivity
      - name: Check FTP port connectivity
        run: |
          timeout 15 bash -c \
            'echo > /dev/tcp/162.55.6.159/21'

          echo "FTP server port 21 is reachable."

      # 6. Upload backend
      - name: Write deployed commit stamp
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/medify-api/deployed-commit.txt"
      - name: Deploy backend via explicit FTPS
        run: |
          bash deployment/scripts/ftp-upload.sh \
            "$RUNNER_TEMP/medify-api"

      # 7. Restart Passenger Node application
      - name: Restart cPanel Passenger Node app
        run: |
          mkdir -p "$RUNNER_TEMP/passenger-restart"

          date -u +%FT%TZ \
            > "$RUNNER_TEMP/passenger-restart/restart.txt"

          FTP_DIR="${FTP_DIR%/}/tmp" \
            bash deployment/scripts/ftp-upload.sh \
            "$RUNNER_TEMP/passenger-restart"

          echo "Passenger restart requested."

      # 8. Verify API health
      # TEMPORARY: --insecure bypasses self-signed SSL certificate
      - name: Verify Medify API health
        run: |
          curl \
            --insecure \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 8 \
            --retry-connrefused \
            --max-time 20 \
            https://site.med-ify.live/api/healthz

      # 9. Deployment completed
      - name: Verify exact deployed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --insecure --silent --show-error --max-time 15 https://site.med-ify.live/api/deployed-commit || true)"
            if echo "$response" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("commit")==os.environ["EXPECTED_SHA"] else 1)' 2>/dev/null; then
              echo "Verified live API is running commit $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt/18: live API has not reported the expected commit yet"
            sleep 10
          done
          echo "ERROR: Live Medify API did not serve commit $EXPECTED_SHA"
          exit 1
      - name: Deployment completed
        run: |
          echo "===================================="
          echo "Medify API deployment successful!"
          echo "Backend uploaded to cPanel."
          echo "Passenger restart requested."
          echo "API health check passed."
          echo "===================================="
