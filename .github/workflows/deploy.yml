
name: Deploy Medify API to cPanel

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deployment/scripts/ftp-upload.sh"
      - "deployment/scripts/ftp-verify-commit.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medify-api-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy Medify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_HOST: ${{ secrets.API_FTP_SERVER }}
      FTP_PORT: "21"
      FTP_USER: "medifydeploy@site.med-ify.live"
      FTP_DIR: "/"
      FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
      API_URL: "https://site.med-ify.live"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Validate FTP configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_DIR"

          echo "FTP configuration provided."

      # Diagnose the actual destination used by GitHub.
      - name: Diagnose FTP destination
        shell: bash
        run: |
          set -euo pipefail

          echo "===================================="
          echo "MEDIFY FTP DESTINATION DIAGNOSTICS"
          echo "===================================="

          echo "FTP host: $FTP_HOST"
          echo "FTP port: $FTP_PORT"
          echo "FTP user: $FTP_USER"
          echo "FTP directory: $FTP_DIR"

          echo ""
          echo "DNS resolution:"
          getent ahostsv4 "$FTP_HOST" | head -3

          echo ""
          echo "Expected cPanel FTP IP: 162.55.6.159"

          echo ""
          echo "FTP connection check:"
          timeout 15 bash -c \
            'echo > /dev/tcp/"$1"/"$2"' \
            _ "$FTP_HOST" "$FTP_PORT"

          echo "FTP port reachable."

          echo "===================================="

      - name: Prepare Medify backend
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/medify-api"

          cp -a backend/. "$RUNNER_TEMP/medify-api/"

          rm -rf \
            "$RUNNER_TEMP/medify-api/node_modules" \
            "$RUNNER_TEMP/medify-api/.env" \
            "$RUNNER_TEMP/medify-api/.local-data" \
            "$RUNNER_TEMP/medify-api/private-uploads" \
            "$RUNNER_TEMP/medify-api/uploads" \
            "$RUNNER_TEMP/medify-api/medify-storage" \
            "$RUNNER_TEMP/medify-api/tmp"

          printf '%s\n' "$GITHUB_SHA" \
            > "$RUNNER_TEMP/medify-api/deployed-commit.txt"

          echo "Prepared backend for commit $GITHUB_SHA"

      - name: Deploy backend via explicit FTPS
        shell: bash
        run: |
          set -euo pipefail

          bash deployment/scripts/ftp-upload.sh \
            "$RUNNER_TEMP/medify-api"

          echo "Backend FTP upload completed."

      - name: Verify uploaded commit via FTPS
        shell: bash
        run: |
          set -euo pipefail

          bash deployment/scripts/ftp-verify-commit.sh \
            "$GITHUB_SHA"

      - name: Restart cPanel Passenger Node app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/passenger-restart"

          date -u +%FT%TZ \
            > "$RUNNER_TEMP/passenger-restart/restart.txt"

          FTP_DIR="${FTP_DIR%/}/tmp" \
            bash deployment/scripts/ftp-upload.sh \
            "$RUNNER_TEMP/passenger-restart"

          echo "Passenger restart requested."

      - name: Verify Medify API health
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --insecure \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 8 \
            --retry-connrefused \
            --max-time 20 \
            "$API_URL/api/healthz"

          echo ""
          echo "API health check passed."

      # The deployment must not show success when
      # the live API is still serving an old commit.
      - name: Verify live deployed commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="$GITHUB_SHA"

          echo "Expected commit: $EXPECTED_SHA"

          for attempt in 1 2 3 4 5 6; do
            echo "Live commit check $attempt/6"

            HTTP_STATUS="$(curl \
              --insecure \
              --silent \
              --show-error \
              --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/live-commit.json" \
              --write-out '%{http_code}' \
              "$API_URL/api/deployed-commit?check=$EXPECTED_SHA" \
              || true)"

            echo "HTTP status: $HTTP_STATUS"

            if [[ "$HTTP_STATUS" == "200" ]]; then
              ACTUAL_SHA="$(python3 - "$RUNNER_TEMP/live-commit.json" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  print(json.load(f).get("commit", ""))
          except (OSError, ValueError):
              print("")
          PY
              )"

              echo "Live commit: $ACTUAL_SHA"

              if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then
                echo "Live deployment verified successfully."
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "::error::Live API commit does not match GitHub commit."
          echo "::error::FTP upload succeeded but the live application is outdated."
          exit 1

      - name: Deployment completed
        shell: bash
        run: |
          echo "===================================="
          echo "MEDIFY API DEPLOYMENT SUCCESSFUL"
          echo "===================================="
          echo "GitHub commit: $GITHUB_SHA"
          echo "FTP upload verified."
          echo "Passenger restart requested."
          echo "API health passed."
          echo "Live commit verified."
          echo "===================================="
